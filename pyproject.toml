[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4one"
version = "0.3.2"
authors = [{ name = "bestenevoy", email = "bestenevoy@outlook.com" }]
description = "A lightweight, modular toolkit for building AI-powered applications"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "mcp", "cli", "config", "tools"]
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "dotenv>=0.9.9",
  "mcp[cli]>=1.13.0",
  "requests>=2.31.0",
  "simple-parsing>=0.1.5",
  "typer",
]

[project.optional-dependencies]
yaml = ["PyYAML"]
all = ["ai4one[yaml]"]
dev = ["pytest", "ai4one[all]"]

[project.urls]
Homepage = "https://github.com/bestenevoy/ai4one"
Issues = "https://github.com/bestenevoy/ai4one/issues"

[project.scripts]
ai4one = "ai4one.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:marshmallow"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai4one.mcp" = ["*.py"]
